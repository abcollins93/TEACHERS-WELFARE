<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://jlwdtlhlztbgpogqdabu.supabase.co" crossorigin>
  <title>Opening School Gateway…</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;background:#0b132b;color:#f8fafc;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
    main{max-width:440px;width:calc(100% - 40px);box-sizing:border-box;margin:auto 20px 20px;padding:28px;background:#1c2541;border:1px solid #3a506b;border-radius:28px;text-align:center;box-shadow:0 20px 25px -5px rgba(0,0,0,0.3)}
    a{color:#f59e0b;font-weight:700;text-decoration:none;touch-action:manipulation}
     a:hover{text-decoration:underline}
     button,[role="button"]{touch-action:manipulation}
    h1{color:#f8fafc;font-size:1.5rem;margin-bottom:0.5rem}
    p{color:#94a3b8}
  </style>

<!-- Tenant-specific manifest is injected by pwa.js before the page finishes loading. -->
<meta name="theme-color" content="#0b1d3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Welfare">
<link rel="icon" type="image/svg+xml" href="./icons/welfare-portal.svg">
<link rel="apple-touch-icon" href="./icons/welfare-portal.svg">
<script src="./pwa.js?v=demo-sandbox-20261117" defer></script>
</head>
<body>
  <main>
    <h1>Opening your school gateway</h1>
    <p id="message">Please wait…</p>
    <p><a id="continue" href="#">Continue to school sign in</a></p>
  </main>
  <script>
    (function(){
      var params = new URLSearchParams(window.location.search);
      var hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
      function stored(key){try{return sessionStorage.getItem(key)||localStorage.getItem(key)||'';}catch(_){return '';}}
      var message = document.getElementById('message');
      var link = document.getElementById('continue');
      var heading = document.querySelector('main h1');
      var redirecting = false;
      function navigate(target, label) {
        if (redirecting) return;
        redirecting = true;
        link.href = target.href;
        message.textContent = label || 'School verified. Opening your portal…';
        window.location.replace(target.href);
        window.setTimeout(function(){
          if (document.visibilityState === 'visible') {
            link.style.display = 'inline';
            link.textContent = 'Open school portal';
          }
        }, 1400);
      }
      var code = (params.get('c') || params.get('school_code') || params.get('tenant') || params.get('school') ||
        hashParams.get('c') || hashParams.get('school_code') || hashParams.get('tenant') || hashParams.get('school') ||
        stored('invited_school_code') || stored('active_tenant_code') || '').trim().toUpperCase();
      if (code === 'DEMO') {
        var demoTarget = new URL('school-portal.html', window.location.href);
        demoTarget.searchParams.set('c', 'DEMO');
        demoTarget.searchParams.set('role', 'teacher');
        navigate(demoTarget, 'Opening the live DEMO sandbox…');
        return;
      }
      if (code && code !== 'DEMO' && /^[A-Z0-9-]{2,32}$/.test(code)) {
        try { localStorage.setItem('invited_school_code', code); localStorage.setItem('active_tenant_code', code); } catch (_) {}
        try { sessionStorage.setItem('invited_school_code', code); sessionStorage.setItem('active_tenant_code', code); } catch (_) {}
      }
      (async function(){
      function block(title, detail) {
        if (heading) heading.textContent = title;
        message.textContent = detail;
        link.style.display = 'none';
        document.title = title + ' | Teachers Welfare Fund';
      }
      if (!/^[A-Z0-9-]{2,32}$/.test(code)) {
        block('Invalid school gateway', 'This gateway link is missing a valid school code. Please request a new link from your platform administrator.');
        return;
      }
      try {
        var gatewayController = typeof AbortController === 'function' ? new AbortController() : null;
        var gatewayDeadline, gatewayJsonDeadline, response, records;
        try {
          response = await Promise.race([
            fetch('https://jlwdtlhlztbgpogqdabu.supabase.co/rest/v1/platform_schools?select=status&school_code=eq.' + encodeURIComponent(code), {
              headers: { apikey: 'sb_publishable_-idvZBti_BY5Xn8xDxhqqw_p_Me6X8O' },
              cache: 'no-store',
              signal: gatewayController ? gatewayController.signal : undefined
            }),
            new Promise(function(_, reject){
              gatewayDeadline = window.setTimeout(function(){
                if(gatewayController)gatewayController.abort();
                reject(new Error('School gateway verification timed out.'));
              }, 8000);
            })
          ]);
          if (!response.ok) throw new Error('School access status could not be verified.');
          records = await Promise.race([
            response.json(),
            new Promise(function(_, reject){
              gatewayJsonDeadline = window.setTimeout(function(){ reject(new Error('School gateway response timed out.')); }, 8000);
            })
          ]);
        } finally {
          window.clearTimeout(gatewayDeadline);
          window.clearTimeout(gatewayJsonDeadline);
        }
        if (!Array.isArray(records) || records.length !== 1) {
          block('School gateway unavailable', 'This school code could not be verified. Please contact the platform administrator.');
          return;
        }
        if (String(records[0].status).toLowerCase() !== 'active') {
          block('School account suspended', 'Access to this school portal has been suspended. Please contact your platform administrator for assistance.');
          return;
        }
        var target = new URL('school-portal.html', window.location.href);
        target.searchParams.set('c', code);
        target.searchParams.delete('school');
        navigate(target, 'School verified. Opening your secure portal…');
      } catch (error) {
        block('School gateway unavailable', 'We could not verify this school’s access status. For security, sign-in is blocked. Please try again later or contact the platform administrator.');
      }
      })();
    })();
  </script>
</body>
</html>
