<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Opening School Gateway…</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b132b;color:#f8fafc;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
    main{max-width:440px;margin:20px;padding:28px;background:#1c2541;border:1px solid #3a506b;border-radius:28px;text-align:center;box-shadow:0 20px 25px -5px rgba(0,0,0,0.3)}
    a{color:#f59e0b;font-weight:700;text-decoration:none}
    a:hover{text-decoration:underline}
    h1{color:#f8fafc;font-size:1.5rem;margin-bottom:0.5rem}
    p{color:#94a3b8}
  </style>

<!-- Tenant-specific manifest is injected by pwa.js before the page finishes loading. -->
<meta name="theme-color" content="#0b1d3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Welfare Portal">
<link rel="icon" type="image/svg+xml" href="./icons/welfare-portal.svg">
<link rel="apple-touch-icon" href="./icons/welfare-portal.svg">
<script src="./pwa.js" defer></script>
</head>
<body>
  <main>
    <h1>Opening your school gateway</h1>
    <p id="message">Please wait…</p>
    <p><a id="continue" href="#">Continue to school sign in</a></p>
  </main>
  <script>
    (async function(){
      var params = new URLSearchParams(window.location.search);
      var code = (params.get('c') || params.get('school') || '').trim().toUpperCase();
      var message = document.getElementById('message');
      var link = document.getElementById('continue');
      var heading = document.querySelector('main h1');
      function block(title, detail) {
        if (heading) heading.textContent = title;
        message.textContent = detail;
        link.style.display = 'none';
        document.title = title + ' | Teachers Welfare Fund';
      }
      if (!/^[A-Z0-9-]{2,32}$/.test(code)) {
        block('Invalid school gateway', 'This gateway link is missing a valid school code. Please request a new link from your platform administrator.');
        return;
      }
      try {
        const response = await fetch('https://jlwdtlhlztbgpogqdabu.supabase.co/rest/v1/platform_schools?select=status&school_code=eq.' + encodeURIComponent(code), {
          headers: { apikey: 'sb_publishable_-idvZBti_BY5Xn8xDxhqqw_p_Me6X8O' },
          cache: 'no-store'
        });
        if (!response.ok) throw new Error('School access status could not be verified.');
        const records = await response.json();
        if (!Array.isArray(records) || records.length !== 1) {
          block('School gateway unavailable', 'This school code could not be verified. Please contact the platform administrator.');
          return;
        }
        if (String(records[0].status).toLowerCase() !== 'active') {
          block('School account suspended', 'Access to this school portal has been suspended. Please contact your platform administrator for assistance.');
          return;
        }
        var target = new URL('school-portal.html', window.location.href);
        target.searchParams.set('school', code);
        link.href = target.href;
        window.location.replace(target.href);
      } catch (error) {
        block('School gateway unavailable', 'We could not verify this school’s access status. For security, sign-in is blocked. Please try again later or contact the platform administrator.');
      }
    })();
  </script>
</body>
</html>
